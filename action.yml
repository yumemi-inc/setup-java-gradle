name: "Setup Java - Gradle"
description: "A GitHub Action that sets up a Java and Gradle environment."
author: "YUMEMI Inc."
branding:
  icon: "box"
  color: "blue"
inputs:
  java-version:
    description: "Java version to use."
    required: false
    default: "21"
  java-distribution: # original name is 'distribution'
    description: "Java distribution to use."
    required: false
    default: "zulu"
  cache-disabled:
    description: "Whether to read/write Gradle cache."
    required: false
    default: "false"
  cache-read-only:
    description: "Whether to only read Gradle cache."
    required: false
    default: "true"
  cache-cleanup:
    description: "When to remove stale/unused Gradle cache before writing: never, on-success, or always."
    required: false
    default: "never"
  gradle-build-report: # original name is 'add-job-summary'
    description: "Whether to display Gradle build reports in Job Summaries."
    required: false
    default: "always"
  kotlin-compiler-report:
    description: "Whether to apply Kotlin compiler Problem Matchers."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      with:
        cache-disabled: ${{ inputs.cache-disabled }}
        cache-read-only: ${{ inputs.cache-read-only }}
        cache-cleanup: ${{ inputs.cache-cleanup }}
        add-job-summary: ${{ inputs.gradle-build-report }}
    - name: Setup Problem Matchers
      if: inputs.kotlin-compiler-report != 'false'
      uses: yumemi-inc/problem-matchers/kotlin-gradle@891cd454f97fdef90de80905fc6eb0759f1e4c87 # v1.0.0
